<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight Photo Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .logo {
      margin-bottom: 4px;
    }

    .logo img {
      height: 170px;
      width: auto;
      display: block;
    }

    .tagline {
      color: #888;
      margin-bottom: 40px;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .card {
      background: #13131a;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 24px;
      color: #c9a84c;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: #1e1e2e;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #c9a84c;
    }

    .upload-area {
      border: 2px dashed #2a2a3a;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .upload-area:hover { border-color: #c9a84c; }
    .upload-area p { color: #888; font-size: 0.9rem; }
    .upload-area span { color: #c9a84c; font-weight: 600; }

    #fileInput { display: none; }
    #fileCount { color: #c9a84c; font-size: 0.85rem; margin-bottom: 20px; }

    button {
      width: 100%;
      padding: 14px;
      background: #c9a84c;
      color: #0a0a0f;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .result { margin-top: 32px; text-align: center; display: none; }
    .result h3 { color: #c9a84c; margin-bottom: 16px; }
    .result img { width: 200px; height: 200px; border-radius: 12px; margin-bottom: 16px; }

    .album-link {
      display: block;
      color: #888;
      font-size: 0.8rem;
      word-break: break-all;
      margin-bottom: 16px;
    }

    .download-btn {
      background: #1e1e2e;
      color: #c9a84c;
      border: 1px solid #c9a84c;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      width: auto;
      display: inline-block;
    }

    .expiry-note {
      color: #888;
      font-size: 0.8rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="https://raw.githubusercontent.com/moonlight-photo-studio/moonlight-photo-studio/4d89945c9e4a44602ee7381168ba2a9ea9f0670e/public/logo.png" alt="Moonlight Photo Studio">
  </div>
  <div class="tagline">Photo Studio — Internal Upload</div>

  <div class="card">
    <h2>Create Client Album</h2>

    <label>Client Name</label>
    <input type="text" id="clientName" placeholder="e.g. Juan dela Cruz">

    <label>Photos</label>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <p>Click to select photos</p>
      <p><span>Browse files</span></p>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*">
    <div id="fileCount">No files selected</div>

    <button id="uploadBtn" onclick="uploadPhotos()" disabled>Generate QR Code</button>

    <div class="result" id="result">
      <h3>✅ Album Created!</h3>
      <img id="qrImage" src="" alt="QR Code" style="width:200px;height:200px;background:#fff;padding:8px;border-radius:8px;">
      <a class="album-link" id="albumLink" target="_blank"></a>
      <button class="download-btn" onclick="downloadQR()">Download QR Code</button>
      <p class="expiry-note">⏱ This QR code expires in 12 hours</p>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileCount = document.getElementById('fileCount');

    fileInput.addEventListener('change', () => {
      const count = fileInput.files.length;
      fileCount.textContent = count > 0 ? `${count} photo(s) selected` : 'No files selected';
      uploadBtn.disabled = count === 0 || !document.getElementById('clientName').value;
    });

    document.getElementById('clientName').addEventListener('input', () => {
      uploadBtn.disabled = fileInput.files.length === 0 || !document.getElementById('clientName').value;
    });

    async function uploadPhotos() {
      const clientName = document.getElementById('clientName').value;
      if (!clientName) return alert('Please enter client name');
      if (fileInput.files.length === 0) return alert('Please select photos');

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';

      const formData = new FormData();
      formData.append('client_name', clientName);
      for (const file of fileInput.files) formData.append('photos', file);

      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();

        const qrImg = document.getElementById('qrImage');
        qrImg.src = '';
        setTimeout(() => { qrImg.src = data.qrCode; }, 100);
        document.getElementById('albumLink').href = data.albumUrl;
        document.getElementById('albumLink').textContent = data.albumUrl;
        document.getElementById('result').style.display = 'block';

        uploadBtn.textContent = 'Generate QR Code';
      } catch (err) {
        alert('Upload failed. Please try again.');
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Generate QR Code';
      }
    }

    function downloadQR() {
      const link = document.createElement('a');
      link.download = 'moonlight-qr.png';
      link.href = document.getElementById('qrImage').src;
      link.click();
    }
  </script>

</body>
</html>
