<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight Photo Studio</title>
  <style>
    /* ... Keep all your beautiful CSS styles intact ... */
    input[type="url"] {
      width: 100%;
      padding: 12px 16px;
      background: #1e1e2e;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
    }
    input[type="url"]:focus { border-color: #c9a84c; }
  </style>
</head>
<body>

  <div class="logo">
    <img src="https://raw.githubusercontent.com/moonlight-photo-studio/moonlight-photo-studio/4d89945c9e4a44602ee7381168ba2a9ea9f0670e/public/logo.png" alt="Moonlight Photo Studio">
  </div>
  <div class="tagline">Photo Studio — Internal Link Upload</div>

  <div class="card">
    <h2>Create Client Album Link</h2>

    <label>Client Name</label>
    <input type="text" id="clientName" placeholder="e.g. Juan dela Cruz">

    <label>Google Drive Link</label>
    <input type="url" id="driveUrl" placeholder="https://drive.google.com/drive/folders/...">

    <button id="uploadBtn" onclick="generateLink()" disabled>Generate QR Code</button>

    <div class="result" id="result">
      <h3>✅ Redirect QR Created!</h3>
      <img id="qrImage" src="" alt="QR Code" style="width:200px;height:200px;background:#fff;padding:8px;border-radius:8px;">
      <a class="album-link" id="albumLink" target="_blank"></a>
      <button class="download-btn" onclick="downloadQR()">Download QR Code</button>
      <p class="expiry-note">⏱ This QR gateway access will break entirely in 12 hours</p>
    </div>
  </div>

  <script>
    const clientNameInput = document.getElementById('clientName');
    const driveUrlInput = document.getElementById('driveUrl');
    const uploadBtn = document.getElementById('uploadBtn');

    function validateForm() {
      uploadBtn.disabled = !clientNameInput.value.trim() || !driveUrlInput.value.trim();
    }

    clientNameInput.addEventListener('input', validateForm);
    driveUrlInput.addEventListener('input', validateForm);

    async function generateLink() {
      const clientName = clientNameInput.value.trim();
      const driveUrl = driveUrlInput.value.trim();

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Processing...';

      try {
        const res = await fetch('/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_name: clientName, drive_url: driveUrl })
        });
        
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        document.getElementById('qrImage').src = data.qrCode;
        document.getElementById('albumLink').href = data.albumUrl;
        document.getElementById('albumLink').textContent = data.albumUrl;
        document.getElementById('result').style.display = 'block';

        uploadBtn.textContent = 'Generate QR Code';
        uploadBtn.disabled = false;
      } catch (err) {
        alert('Failed to generate. Please verify your data.');
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Generate QR Code';
      }
    }

    function downloadQR() {
      const link = document.createElement('a');
      link.download = 'moonlight-redirect-qr.png';
      link.href = document.getElementById('qrImage').src;
      link.click();
    }
  </script>
</body>
</html>
